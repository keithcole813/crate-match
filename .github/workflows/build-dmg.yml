name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg via brew
        run: brew install ffmpeg

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build .app with PyInstaller
        run: |
          FFMPEG_BIN=$(brew --prefix ffmpeg)/bin/ffmpeg
          pyinstaller --clean --noconfirm \
            --name "CrateMatch Live" \
            --windowed \
            --onedir \
            --add-binary "$FFMPEG_BIN:." \
            --hidden-import tkinterdnd2 \
            --hidden-import librosa \
            --collect-all librosa \
            --collect-all numba \
            live_window.py

      - name: Create DMG
        run: |
          DMG="CrateMatch-Live-macOS.dmg"
          rm -f "$DMG"
          hdiutil create -volname "CrateMatch Live" \
            -srcfolder "dist/CrateMatch Live.app" \
            -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: CrateMatch-Live-macOS.dmg
          body: |
            ## CrateMatch Live for macOS
            Download the DMG, open it, drag CrateMatch Live to Applications.
            Right-click > Open on first launch (unsigned app).
            No command line needed — ffmpeg is bundled.
